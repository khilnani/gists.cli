name: Delete temporary CrossInk build branch

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/delete-crossink-text-dashboard-branch.yml'

permissions:
  contents: write

jobs:
  delete-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Delete branch
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.git.deleteRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/crossink-text-dashboard-build'
            })
